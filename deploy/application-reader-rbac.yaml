apiVersion: v1
kind: List
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: argo-guard-application-reader
      namespace: argocd
    rules:
      - apiGroups: ["argoproj.io"]
        resources: ["applications"]
        verbs: ["get"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: argo-guard-application-reader
      namespace: argocd
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: argo-guard-application-reader
    subjects:
      - kind: ServiceAccount
        name: argocd-repo-server
        namespace: argocd
